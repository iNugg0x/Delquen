<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Delquen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Delquen</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A52"/>
      <stop offset="1" stop-color="#0B1022"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="#3B4C8A" stroke-opacity=".45"/>
  <!-- glow and shadow -->
  <path d="M86 70H118A58 58 0 0 1 118 186H86Z" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="30" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M86 76H118A58 58 0 0 1 118 192H86Z" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="30" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- the D -->
  <path d="M86 70H118A58 58 0 0 1 118 186H86Z" fill="none" stroke="url(#d)" stroke-width="30" stroke-linejoin="round"/>
  <!-- frame-time pulse -->
  <polyline points="104,128 120,128 129,102 139,154 148,128 156,128" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
